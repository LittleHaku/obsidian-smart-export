name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Enable Corepack
        run: corepack enable pnpm

      - name: Verify pinned pnpm
        run: corepack pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run linting
        run: pnpm lint

      - name: Check mobile compatibility
        run: pnpm mobile:check

      - name: Check types
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Checkout performance baseline
        if: runner.os == 'Windows'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: .benchmark-base

      - name: Install performance baseline dependencies
        if: runner.os == 'Windows'
        working-directory: .benchmark-base
        run: pnpm install --frozen-lockfile

      - name: Measure performance baseline
        if: runner.os == 'Windows'
        working-directory: .benchmark-base
        run: pnpm benchmark

      - name: Check performance regression
        if: runner.os == 'Windows'
        run: |
          pnpm benchmark
          node scripts/check-benchmark-regression.mjs .benchmark-base/benchmarks/latest-report.json benchmarks/latest-report.json .benchmark-base/benchmarks/baseline.json

      - name: Upload coverage reports
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: true
          flags: unittests
          name: codecov-umbrella
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-status:
    name: Test & Lint
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: test

    steps:
      - name: Require all test matrix jobs
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            exit 1
          fi

  build:
    name: Build Plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test-status
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Enable Corepack
        run: corepack enable pnpm

      - name: Verify pinned pnpm
        run: corepack pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm build

      - name: Upload build artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: plugin-build
          path: |
            main.js
            manifest.json
            styles.css
          retention-days: 7

  build-status:
    name: Build Plugin
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: build

    steps:
      - name: Require all build matrix jobs
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            exit 1
          fi
