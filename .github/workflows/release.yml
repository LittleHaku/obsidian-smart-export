name: Create Plugin Release

on:
  push:
    tags:
      - "*"

env:
  PLUGIN_NAME: obsidian-smart-export

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine prerelease status
        id: status
        run: |
          if [[ "${{ github.ref }}" == *"canary"* ]] || [[ "${{ github.ref }}" == *"alpha"* ]] || [[ "${{ github.ref }}" == *"beta"* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Enable Corepack
        run: corepack enable pnpm

      - name: Verify pinned pnpm
        run: corepack pnpm --version

      - name: Validate release metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/validate-release.mjs --tag "$TAG" --sha "$GITHUB_SHA" --main-ref origin/main

      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          mkdir release-assets
          cp main.js manifest.json release-assets/
          if [[ -f styles.css ]]; then cp styles.css release-assets/; fi
          node scripts/validate-release.mjs --tag "${{ github.ref_name }}" --sha "$GITHUB_SHA" --main-ref origin/main --assets-dir release-assets

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="$TAG"
          if ! grep -q "^## \\[${VERSION}\\]" CHANGELOG.md; then
            {
              echo "## ${VERSION}"
              echo ""
              echo "Release notes not found in CHANGELOG.md."
            } > release-notes.md
          else
            awk -v ver="${VERSION}" '
              $0 ~ "^## \\[" ver "\\]" {found=1}
              found && $0 ~ "^## \\[" && $0 !~ "^## \\[" ver "\\]" {exit}
              found {print}
            ' CHANGELOG.md > release-notes.md
          fi

          git fetch --tags --force
          if [[ "$TAG" == v* ]]; then
            TAG_FILTER='^v'
          else
            TAG_FILTER='^[0-9]'
          fi
          PREV_TAG=$(git tag --list | grep -E "$TAG_FILTER" | sort -V | awk -v tag="$TAG" '$0==tag {print prev} {prev=$0}')

          if [[ -n "$PREV_TAG" ]]; then
            NOTES_JSON=$(curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/generate-notes" \
              -d "{\"tag_name\":\"${TAG}\",\"previous_tag_name\":\"${PREV_TAG}\"}")
          else
            NOTES_JSON=$(curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/generate-notes" \
              -d "{\"tag_name\":\"${TAG}\"}")
          fi

          NOTES_BODY=$(python -c 'import json, sys; data = json.load(sys.stdin); print((data.get("body") or "").strip())' <<<"$NOTES_JSON")

          if [[ -n "$NOTES_BODY" ]]; then
            echo "" >> release-notes.md
            echo "$NOTES_BODY" >> release-notes.md
          fi

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.status.outputs.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: release-notes.md
          files: release-assets/*
